<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="envelope" id="envelope">
        <div class="letter">
            <h1>❤️ Happy Girlfriend's Day ❤️</h1>

            <p id="message">
                To the girl I adore...<br><br>

                Every moment with you is my favorite memory.<br>
                Thank you for making my life beautiful. 🌸<br><br>

                I Love You Forever ❤️
            </p>

            <button id="openBtn">
                Open My Heart 💌
            </button>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
